<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Senha</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/senha.css">
</head>

<body>

<div class="container">

  <h1 id="titulo">Gerando senha...</h1>

  <div id="loading" class="loading-screen active">
    <div class="spinner"></div>
    <p>Processando...</p>
  </div>

  <div id="resultado" style="display: none;">

    <div id="senhaBox" class="senha-box">
      <p class="label">Sua senha é:</p>
      <div id="senha" class="senha-numero"></div>
    </div>

    <p id="mensagem" class="mensagem"></p>

  </div>

</div>

<script src="../js/senha.js"></script>

</body>
</html>
